[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qcom-kernel-merger"
version = "0.1.0"
description = "Put an OEM kernel source on top of the closest CodeLinaro (CLO) tag"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qcmerge = "qcmerge.cli:main"

[tool.setuptools]
packages = ["qcmerge"]
